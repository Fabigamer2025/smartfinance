<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SmartFinance Pro</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCMN5nyM-A5DAIlrVjDEBXbtztwhEp34gM",
      authDomain: "smartfinance-1f85a.firebaseapp.com",
      projectId: "smartfinance-1f85a",
      storageBucket: "smartfinance-1f85a.firebasestorage.app",
      messagingSenderId: "101380229220",
      appId: "1:101380229220:web:53362aef6e42f13ed3f771"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.firebaseAuth = { auth, db, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, doc, setDoc, onSnapshot };
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans antialiased pb-20 selection:bg-emerald-500">

  <!-- MODAL LOGIN -->
  <div id="authModal" class="fixed inset-0 bg-zinc-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl w-full max-w-sm">
      <div class="text-center mb-5">
        <div class="w-10 h-10 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-xl flex items-center justify-center mx-auto mb-2">
          <i class="fa-solid fa-vault"></i>
        </div>
        <h2 id="authTitle" class="text-lg font-bold text-white">SmartFinance</h2>
        <p class="text-[11px] text-zinc-400">Ingresa tus credenciales</p>
      </div>

      <form id="authForm" class="space-y-3">
        <input type="email" id="authEmail" required placeholder="Correo electrónico" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2.5 text-white text-xs outline-none focus:border-emerald-500">
        <input type="password" id="authPassword" required placeholder="Contraseña" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2.5 text-white text-xs outline-none focus:border-emerald-500">
        <div id="authError" class="text-[11px] text-rose-400 hidden text-center bg-rose-950/30 p-2 rounded border border-rose-500/20"></div>
        <button type="submit" id="authSubmitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-zinc-950 font-bold py-2.5 rounded-lg text-xs active:scale-95">Entrar</button>
      </form>

      <div class="text-center mt-4">
        <button id="toggleAuthMode" class="text-[11px] text-zinc-400">¿Sin cuenta? Regístrate</button>
      </div>
    </div>
  </div>

  <!-- MODAL HISTORIAL -->
  <div id="historyModal" class="fixed inset-0 bg-zinc-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl w-full max-w-md max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-3 border-b border-zinc-800 pb-2">
        <h3 class="text-xs font-bold text-zinc-200">Historial Completo</h3>
        <button id="closeHistoryBtn" class="text-zinc-400"><i class="fa-solid fa-xmark text-base"></i></button>
      </div>
      <div id="historyModalList" class="space-y-2 overflow-y-auto flex-1 pr-1"></div>
      <div class="mt-3 pt-2 border-t border-zinc-800 flex justify-between">
        <button id="exportExcelBtn" class="text-[11px] bg-zinc-800 text-emerald-400 border border-zinc-700 px-3 py-1.5 rounded-lg font-semibold"><i class="fa-solid fa-file-excel mr-1"></i> Excel</button>
        <button id="closeHistoryBtn2" class="text-[11px] bg-zinc-800 text-zinc-300 px-3 py-1.5 rounded-lg font-semibold">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL -->
  <div id="mainApp" class="px-4 py-4 hidden transition-all duration-300">
    
    <!-- Navbar Superior -->
    <header class="flex justify-between items-center mb-4 bg-zinc-900/90 border border-zinc-800/80 px-4 py-2.5 rounded-xl max-w-6xl mx-auto">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center font-bold text-xs">
          <i class="fa-solid fa-wallet"></i>
        </div>
        <div>
          <span class="text-xs font-bold tracking-wider text-white block">SmartFinance</span>
          <span id="userEmailDisplay" class="text-[10px] text-zinc-400 hidden sm:inline">Cargando...</span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="setApiKeyPrompt()" class="text-xs bg-zinc-950 border border-zinc-800 text-amber-400 px-2.5 py-1.5 rounded-lg font-semibold active:scale-95 transition-all" title="Configurar API Key de Gemini">
          <i class="fa-solid fa-key mr-1"></i> Key
        </button>

        <button id="viewToggleBtn" onclick="toggleViewMode()" class="text-xs bg-zinc-950 border border-zinc-800 text-emerald-400 px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1.5 active:scale-95 transition-all">
          <i id="viewToggleIcon" class="fa-solid fa-mobile-screen"></i>
          <span id="viewToggleText">Modo PC</span>
        </button>

        <button id="logoutBtn" class="text-xs text-zinc-400 hover:text-rose-400 p-1.5"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
      </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="appLayoutContainer" class="max-w-md mx-auto transition-all duration-300">
      
      <div id="dashboardGrid" class="space-y-4">

        <!-- BLOQUE BALANCE GENERAL -->
        <div id="card-balance" class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl">
          <span class="text-[10px] text-zinc-400 font-semibold uppercase tracking-wider block mb-1">Balance General</span>
          <span id="walletBalanceDisplay" class="text-2xl font-black text-white block mb-3">Gs. 0</span>
          <div>
            <button id="openHistoryBtn" class="w-full bg-zinc-950 border border-zinc-800 py-2 rounded-lg text-xs text-zinc-300 font-semibold flex items-center justify-center gap-1.5"><i class="fa-solid fa-receipt text-emerald-400"></i> Historial</button>
          </div>
        </div>

        <!-- GESTIÓN DE METAS -->
        <div id="card-goals-form" class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl">
          <div class="flex justify-between items-center mb-3">
            <h2 class="text-xs font-bold text-zinc-200 uppercase tracking-wider">Gestión de Metas</h2>
            <select id="goalSelector" class="bg-zinc-950 border border-zinc-800 rounded-lg px-2 py-1 text-white text-xs outline-none">
              <option value="new">+ Nueva Meta</option>
            </select>
          </div>

          <form id="financeForm" class="space-y-3">
            <div>
              <label class="block text-[11px] font-medium text-zinc-400 mb-1">Nombre de la Meta</label>
              <input type="text" id="goalItem" required placeholder="Ej: Moto / Casa" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-white text-xs outline-none">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[11px] font-medium text-zinc-400 mb-1">Costo Total (Gs.)</label>
                <input type="number" id="goalCost" required placeholder="Ej: 50000000" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-white text-xs outline-none">
              </div>
              <div>
                <label class="block text-[11px] font-medium text-zinc-400 mb-1">Fecha (Opcional)</label>
                <input type="date" id="targetDate" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-2 py-2 text-white text-xs outline-none">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-1">
              <button type="submit" class="bg-emerald-600 text-zinc-950 font-bold py-2 rounded-lg text-xs"><i class="fa-solid fa-floppy-disk mr-1"></i> Guardar</button>
              <button type="button" id="deleteGoalBtn" class="bg-zinc-950 text-rose-400 border border-zinc-800 font-semibold py-2 rounded-lg text-xs"><i class="fa-solid fa-trash-can mr-1"></i> Borrar</button>
            </div>
          </form>
        </div>

        <!-- REGISTRO DINERO -->
        <div id="card-tx-form" class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl">
          <h2 class="text-xs font-bold text-zinc-200 uppercase tracking-wider mb-3">Registrar Dinero / Salario</h2>
          <form id="transactionForm" class="space-y-3">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] font-medium text-zinc-400 mb-1">Tipo</label>
                <select id="txType" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-2 py-2 text-white text-xs outline-none">
                  <option value="deposit">➕ Ingreso / Salario (+)</option>
                  <option value="loss">➖ Egreso (-)</option>
                </select>
              </div>
              <div>
                <label class="block text-[10px] font-medium text-zinc-400 mb-1">Recurrencia</label>
                <select id="txRecurrence" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-2 py-2 text-white text-xs outline-none">
                  <option value="once">Puntual (Único)</option>
                  <option value="weekly">🔄 Salario Semanal</option>
                  <option value="monthly">🔄 Salario Mensual</option>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] font-medium text-zinc-400 mb-1">Monto (Gs.)</label>
                <input type="number" id="txAmount" required placeholder="Ej: 200000" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-white text-xs outline-none">
              </div>
              <div>
                <label class="block text-[10px] font-medium text-zinc-400 mb-1">Detalle</label>
                <input type="text" id="txNote" placeholder="Ej: Sueldo / Ahorro" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-white text-xs outline-none">
              </div>
            </div>

            <button type="submit" class="w-full bg-zinc-100 text-zinc-950 font-bold py-2.5 rounded-lg text-xs"><i class="fa-solid fa-plus mr-1"></i> Añadir Movimiento</button>
          </form>

          <div class="mt-4 pt-3 border-t border-zinc-800">
            <span class="text-[10px] text-zinc-400 font-semibold block mb-2">Operaciones Rápidas</span>
            <div id="quickReuseList" class="flex flex-wrap gap-1.5"></div>
          </div>
        </div>

        <!-- BLOQUE AVANCE Y TIEMPO -->
        <div id="card-progress" class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-bold text-zinc-200">Avance de Meta Activa</span>
            <span id="progressPercentage" class="text-[11px] font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">0%</span>
          </div>
          <div class="w-full bg-zinc-950 rounded-full h-2 border border-zinc-800 overflow-hidden mb-3">
            <div id="progressBar" class="bg-emerald-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
          </div>
          <div id="summary"></div>
        </div>

        <!-- PROYECCIÓN VISUAL -->
        <div id="card-chart" class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl">
          <span class="text-xs font-bold text-zinc-200 block mb-2">Proyección Visual</span>
          <div class="relative h-36 w-full">
            <canvas id="savingsChart"></canvas>
          </div>
        </div>

        <!-- ASESOR IA -->
        <div id="card-ai" class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-bold text-zinc-200">Asesor IA (Gemini)</span>
            <button id="askAiBtn" class="text-[10px] bg-zinc-950 border border-zinc-800 text-emerald-400 px-2 py-1 rounded font-semibold">Consultar</button>
          </div>
          <div id="aiResponse" class="text-xs text-zinc-400">Presiona consultar para recibir un análisis con Google Gemini.</div>
        </div>

      </div>
    </div>

    <!-- NAVEGACIÓN INFERIOR (MÓVIL) -->
    <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 bg-zinc-900 border-t border-zinc-800 p-2 z-40">
      <div class="max-w-md mx-auto flex justify-around">
        <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center text-emerald-400 text-[10px] font-semibold">
          <i class="fa-solid fa-house text-base mb-0.5"></i> Inicio
        </button>
        <button onclick="switchTab('goals')" id="nav-goals" class="nav-btn flex flex-col items-center text-zinc-500 text-[10px] font-semibold">
          <i class="fa-solid fa-bullseye text-base mb-0.5"></i> Metas
        </button>
        <button onclick="switchTab('transactions')" id="nav-transactions" class="nav-btn flex flex-col items-center text-zinc-500 text-[10px] font-semibold">
          <i class="fa-solid fa-right-left text-base mb-0.5"></i> Movimientos
        </button>
      </div>
    </nav>

  </div>

  <script>
    let currentUser = null;
    let isRegisterMode = false;
    let isPcMode = window.innerWidth >= 768;
    let appData = { goals: [], activeGoalIndex: 0, transactions: [] };
    let savingsChart = null;

    function formatPYG(amount) {
      return "Gs. " + new Intl.NumberFormat('es-PY').format(amount || 0);
    }

    // GESTIÓN SEGURA DE API KEY EN LOCALSTORAGE (EVITA BLOQUEOS DE GITHUB)
    function setApiKeyPrompt() {
      const currentKey = localStorage.getItem('gemini_key') || '';
      const key = prompt("Pega aquí tu API Key de Google Gemini:", currentKey);
      if (key !== null) {
        localStorage.setItem('gemini_key', key.trim());
        alert("API Key de Gemini guardada correctamente.");
      }
    }

    window.toggleViewMode = function() {
      isPcMode = !isPcMode;
      applyViewMode();
    }

    function applyViewMode() {
      const container = document.getElementById('appLayoutContainer');
      const bottomNav = document.getElementById('bottomNav');
      const toggleText = document.getElementById('viewToggleText');
      const toggleIcon = document.getElementById('viewToggleIcon');

      const cardGoals = document.getElementById('card-goals-form');
      const cardTx = document.getElementById('card-tx-form');
      const cardBalance = document.getElementById('card-balance');
      const cardProgress = document.getElementById('card-progress');
      const cardChart = document.getElementById('card-chart');
      const cardAi = document.getElementById('card-ai');

      if (isPcMode) {
        container.className = "max-w-6xl mx-auto";
        bottomNav.classList.add('hidden');
        toggleText.innerText = "Modo Móvil";
        toggleIcon.className = "fa-solid fa-mobile-screen";

        document.getElementById('dashboardGrid').className = "grid grid-cols-1 md:grid-cols-2 gap-4";
        
        cardBalance.className = "md:col-span-2 bg-zinc-900 border border-zinc-800 p-4 rounded-xl block";
        cardGoals.className = "bg-zinc-900 border border-zinc-800 p-4 rounded-xl block";
        cardTx.className = "bg-zinc-900 border border-zinc-800 p-4 rounded-xl block";
        cardProgress.className = "bg-zinc-900 border border-zinc-800 p-4 rounded-xl block";
        cardChart.className = "bg-zinc-900 border border-zinc-800 p-4 rounded-xl block";
        cardAi.className = "md:col-span-2 bg-zinc-900 border border-zinc-800 p-4 rounded-xl block";
      } else {
        container.className = "max-w-md mx-auto";
        bottomNav.classList.remove('hidden');
        toggleText.innerText = "Modo PC";
        toggleIcon.className = "fa-solid fa-desktop";

        document.getElementById('dashboardGrid').className = "space-y-4";

        cardBalance.className = "bg-zinc-900 border border-zinc-800 p-4 rounded-xl";
        cardGoals.className = "bg-zinc-900 border border-zinc-800 p-4 rounded-xl";
        cardTx.className = "bg-zinc-900 border border-zinc-800 p-4 rounded-xl";
        cardProgress.className = "bg-zinc-900 border border-zinc-800 p-4 rounded-xl";
        cardChart.className = "bg-zinc-900 border border-zinc-800 p-4 rounded-xl";
        cardAi.className = "bg-zinc-900 border border-zinc-800 p-4 rounded-xl";

        switchTab('home');
      }
    }

    window.switchTab = function(tabName) {
      if (isPcMode) return;

      const cardGoals = document.getElementById('card-goals-form');
      const cardTx = document.getElementById('card-tx-form');
      const cardBalance = document.getElementById('card-balance');
      const cardProgress = document.getElementById('card-progress');
      const cardChart = document.getElementById('card-chart');
      const cardAi = document.getElementById('card-ai');

      document.querySelectorAll('.nav-btn').forEach(el => {
        el.classList.remove('text-emerald-400');
        el.classList.add('text-zinc-500');
      });

      const activeNav = document.getElementById(`nav-${tabName}`);
      if(activeNav) {
        activeNav.classList.remove('text-zinc-500');
        activeNav.classList.add('text-emerald-400');
      }

      if (tabName === 'home') {
        cardBalance.classList.remove('hidden');
        cardProgress.classList.remove('hidden');
        cardChart.classList.remove('hidden');
        cardAi.classList.remove('hidden');
        cardGoals.classList.add('hidden');
        cardTx.classList.add('hidden');
      } else if (tabName === 'goals') {
        cardBalance.classList.add('hidden');
        cardProgress.classList.add('hidden');
        cardChart.classList.add('hidden');
        cardAi.classList.add('hidden');
        cardGoals.classList.remove('hidden');
        cardTx.classList.add('hidden');
      } else if (tabName === 'transactions') {
        cardBalance.classList.add('hidden');
        cardProgress.classList.add('hidden');
        cardChart.classList.add('hidden');
        cardAi.classList.add('hidden');
        cardGoals.classList.add('hidden');
        cardTx.classList.remove('hidden');
      }
    }

    window.addEventListener('load', () => {
      applyViewMode();

      const checkInterval = setInterval(() => {
        if (window.firebaseAuth) {
          clearInterval(checkInterval);
          const { auth, onAuthStateChanged } = window.firebaseAuth;

          onAuthStateChanged(auth, (user) => {
            if (user) {
              currentUser = user;
              document.getElementById('userEmailDisplay').innerText = user.email;
              document.getElementById('authModal').classList.add('hidden');
              document.getElementById('mainApp').classList.remove('hidden');
              listenToUserData();
            } else {
              currentUser = null;
              document.getElementById('authModal').classList.remove('hidden');
              document.getElementById('mainApp').classList.add('hidden');
            }
          });
        }
      }, 100);
    });

    const historyModal = document.getElementById('historyModal');
    document.getElementById('openHistoryBtn').addEventListener('click', () => historyModal.classList.remove('hidden'));
    document.getElementById('closeHistoryBtn').addEventListener('click', () => historyModal.classList.add('hidden'));
    document.getElementById('closeHistoryBtn2').addEventListener('click', () => historyModal.classList.add('hidden'));

    document.getElementById('toggleAuthMode').addEventListener('click', () => {
      isRegisterMode = !isRegisterMode;
      document.getElementById('authTitle').innerText = isRegisterMode ? 'Crear Cuenta' : 'SmartFinance';
      document.getElementById('authSubmitBtn').innerText = isRegisterMode ? 'Registrarme' : 'Entrar';
    });

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPassword').value;
      const errDiv = document.getElementById('authError');
      errDiv.classList.add('hidden');

      const { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword } = window.firebaseAuth;

      try {
        if (isRegisterMode) {
          await createUserWithEmailAndPassword(auth, email, pass);
        } else {
          await signInWithEmailAndPassword(auth, email, pass);
        }
      } catch (err) {
        errDiv.innerText = err.message;
        errDiv.classList.remove('hidden');
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      window.firebaseAuth.signOut(window.firebaseAuth.auth);
    });

    function listenToUserData() {
      const { db, doc, onSnapshot } = window.firebaseAuth;
      const docRef = doc(db, "users", currentUser.uid);

      onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          appData.transactions = data.transactions || [];
          appData.activeGoalIndex = data.activeGoalIndex || 0;

          if (data.goals && Array.isArray(data.goals)) {
            appData.goals = data.goals;
          } else if (data.item && data.cost) {
            appData.goals = [{ item: data.item, cost: data.cost, targetDate: data.targetDate || '' }];
          } else {
            appData.goals = [];
          }

          updateUI();
        }
      });
    }

    async function saveToCloud() {
      if (!currentUser) return;
      const { db, doc, setDoc } = window.firebaseAuth;
      await setDoc(doc(db, "users", currentUser.uid), appData);
    }

    document.getElementById('goalSelector').addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === 'new') {
        document.getElementById('goalItem').value = '';
        document.getElementById('goalCost').value = '';
        document.getElementById('targetDate').value = '';
      } else {
        appData.activeGoalIndex = parseInt(val);
        updateUI();
        saveToCloud();
      }
    });

    document.getElementById('financeForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const item = document.getElementById('goalItem').value;
      const cost = parseFloat(document.getElementById('goalCost').value);
      const targetDate = document.getElementById('targetDate').value || '';

      if (!appData.goals) appData.goals = [];

      const selectVal = document.getElementById('goalSelector').value;
      if (selectVal === 'new') {
        appData.goals.push({ item, cost, targetDate });
        appData.activeGoalIndex = appData.goals.length - 1;
      } else {
        appData.goals[appData.activeGoalIndex] = { item, cost, targetDate };
      }

      updateUI();
      saveToCloud();
      if (!isPcMode) switchTab('home');
    });

    document.getElementById('deleteGoalBtn').addEventListener('click', () => {
      if (!appData.goals || appData.goals.length === 0) return;
      appData.goals.splice(appData.activeGoalIndex, 1);
      appData.activeGoalIndex = 0;
      updateUI();
      saveToCloud();
    });

    document.getElementById('transactionForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const type = document.getElementById('txType').value;
      const recurrence = document.getElementById('txRecurrence').value;
      const amount = parseFloat(document.getElementById('txAmount').value);
      const note = document.getElementById('txNote').value;

      if (!appData.transactions) appData.transactions = [];
      appData.transactions.push({
        type,
        recurrence,
        amount,
        note,
        date: new Date().toLocaleDateString('es-PY'),
        timestamp: Date.now()
      });

      document.getElementById('txAmount').value = '';
      document.getElementById('txNote').value = '';

      updateUI();
      saveToCloud();
      if (!isPcMode) switchTab('home');
    });

    window.reuseTransaction = function(amount, type, recurrence, note) {
      if (!appData.transactions) appData.transactions = [];
      appData.transactions.push({
        type,
        recurrence,
        amount: parseFloat(amount),
        note,
        date: new Date().toLocaleDateString('es-PY'),
        timestamp: Date.now()
      });
      updateUI();
      saveToCloud();
    };

    window.deleteTransaction = function(index) {
      if (!appData.transactions) return;
      appData.transactions.splice(index, 1);
      updateUI();
      saveToCloud();
    };

    document.getElementById('exportExcelBtn').addEventListener('click', () => {
      if (!appData.transactions || appData.transactions.length === 0) return;
      const worksheet = XLSX.utils.json_to_sheet(appData.transactions);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Historial");
      XLSX.writeFile(workbook, "Reporte.xlsx");
    });

    function calculateWalletBalance() {
      if (!appData.transactions) return 0;
      const now = Date.now();

      return appData.transactions.reduce((acc, tx) => {
        let count = 1;
        if (tx.recurrence === 'weekly') {
          const weeksPassed = Math.floor((now - (tx.timestamp || now)) / (1000 * 60 * 60 * 24 * 7));
          count = Math.max(1, weeksPassed + 1);
        } else if (tx.recurrence === 'monthly') {
          const monthsPassed = Math.floor((now - (tx.timestamp || now)) / (1000 * 60 * 60 * 24 * 30));
          count = Math.max(1, monthsPassed + 1);
        }

        const totalTxAmount = tx.amount * count;
        return tx.type === 'deposit' ? acc + totalTxAmount : acc - totalTxAmount;
      }, 0);
    }

    function updateUI() {
      const goalSel = document.getElementById('goalSelector');
      goalSel.innerHTML = appData.goals.map((g, idx) => `
        <option value="${idx}" ${idx === appData.activeGoalIndex ? 'selected' : ''}>${g.item}</option>
      `).join('') + `<option value="new">+ Nueva Meta</option>`;

      const activeGoal = appData.goals[appData.activeGoalIndex];
      if (activeGoal) {
        document.getElementById('goalItem').value = activeGoal.item;
        document.getElementById('goalCost').value = activeGoal.cost;
        document.getElementById('targetDate').value = activeGoal.targetDate || '';
      }

      const walletBalance = calculateWalletBalance();
      document.getElementById('walletBalanceDisplay').innerText = formatPYG(walletBalance);

      renderHistoryAndQuickList();

      if (!activeGoal) {
        document.getElementById('progressBar').style.width = `0%`;
        document.getElementById('progressPercentage').innerText = `0%`;
        document.getElementById('summary').innerHTML = `<p class="text-xs text-zinc-500">Sin meta seleccionada.</p>`;
        return;
      }

      const totalSaved = walletBalance;
      const remainingCost = Math.max(activeGoal.cost - totalSaved, 0);
      const progressRatio = Math.min(Math.max((totalSaved / activeGoal.cost) * 100, 0), 100).toFixed(1);

      let timeEstimationText = "";
      let timeBoxDisplay = "0 sem";

      if (activeGoal.targetDate) {
        const target = new Date(activeGoal.targetDate);
        const weeks = Math.max(Math.ceil(Math.max(target - new Date(), 0) / (1000 * 60 * 60 * 24 * 7)), 1);
        const weeklyNeeded = Math.round(remainingCost / weeks);
        timeBoxDisplay = `${weeks} sem`;
        timeEstimationText = `<span class="text-zinc-400">Cuota semanal:</span> <span class="font-bold text-emerald-400">${formatPYG(weeklyNeeded)}</span>`;
      } else {
        const weeklyDeposit = (appData.transactions || [])
          .filter(t => t.type === 'deposit')
          .reduce((sum, t) => sum + (t.recurrence === 'weekly' ? t.amount : t.recurrence === 'monthly' ? t.amount / 4 : t.amount), 0) || 100000;
        
        const weeks = Math.max(Math.ceil(remainingCost / weeklyDeposit), 1);
        const months = (weeks / 4.33);
        const years = (months / 12);

        if (years >= 1) {
          timeBoxDisplay = `~${years.toFixed(1)} años`;
          timeEstimationText = `<span class="text-zinc-400">Tiempo estimado:</span> <span class="font-bold text-emerald-400">~${years.toFixed(1)} años (${Math.round(months)} meses)</span>`;
        } else if (months >= 1) {
          timeBoxDisplay = `~${Math.round(months)} meses`;
          timeEstimationText = `<span class="text-zinc-400">Tiempo estimado:</span> <span class="font-bold text-emerald-400">~${Math.round(months)} meses (${weeks} sem)</span>`;
        } else {
          timeBoxDisplay = `${weeks} sem`;
          timeEstimationText = `<span class="text-zinc-400">Tiempo estimado:</span> <span class="font-bold text-emerald-400">${weeks} semanas</span>`;
        }
      }

      document.getElementById('progressBar').style.width = `${progressRatio}%`;
      document.getElementById('progressPercentage').innerText = `${progressRatio}%`;

      document.getElementById('summary').innerHTML = `
        <div class="grid grid-cols-3 gap-1.5 mb-2 text-center text-xs">
          <div class="bg-zinc-950 p-2 rounded-lg border border-zinc-800">
            <span class="text-[9px] text-zinc-400 block">Acumulado</span>
            <p class="font-bold text-emerald-400 text-[11px]">${formatPYG(totalSaved)}</p>
          </div>
          <div class="bg-zinc-950 p-2 rounded-lg border border-zinc-800">
            <span class="text-[9px] text-zinc-400 block">Faltante</span>
            <p class="font-bold text-zinc-200 text-[11px]">${formatPYG(remainingCost)}</p>
          </div>
          <div class="bg-zinc-950 p-2 rounded-lg border border-zinc-800">
            <span class="text-[9px] text-zinc-400 block">Tiempo</span>
            <p class="font-bold text-white text-[11px]">${timeBoxDisplay}</p>
          </div>
        </div>
        <div class="bg-zinc-950 p-2 rounded-lg border border-zinc-800 flex justify-between items-center text-xs">
          ${timeEstimationText}
        </div>
      `;

      updateChart(totalSaved, activeGoal.cost, 8);
    }

    function renderHistoryAndQuickList() {
      const modalListDiv = document.getElementById('historyModalList');
      const quickDiv = document.getElementById('quickReuseList');

      if (!appData.transactions || appData.transactions.length === 0) {
        modalListDiv.innerHTML = `<p class="text-xs text-zinc-500 text-center py-4">Sin datos de movimientos.</p>`;
        quickDiv.innerHTML = `<p class="text-[10px] text-zinc-500">Sin registros.</p>`;
        return;
      }

      const reversedTxs = appData.transactions.slice().reverse();
      const originalLength = appData.transactions.length;

      modalListDiv.innerHTML = reversedTxs.map((tx, idx) => {
        const originalIndex = originalLength - 1 - idx;
        const tag = tx.recurrence === 'weekly' ? ' (Semanal)' : tx.recurrence === 'monthly' ? ' (Mensual)' : '';
        return `
          <div class="flex justify-between items-center bg-zinc-950 p-2.5 rounded-lg border border-zinc-800 text-xs">
            <div class="flex items-center gap-2">
              <span class="${tx.type === 'deposit' ? 'text-emerald-400' : 'text-rose-400'} font-bold">
                ${tx.type === 'deposit' ? '↓' : '↑'}
              </span>
              <div>
                <p class="font-semibold text-zinc-200 text-[11px]">${tx.note || 'Movimiento'}${tag}</p>
                <span class="text-[9px] text-zinc-500">${tx.date}</span>
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="font-bold ${tx.type === 'deposit' ? 'text-emerald-400' : 'text-rose-400'} text-[11px]">
                ${tx.type === 'deposit' ? '+' : '-'}${formatPYG(tx.amount)}
              </span>
              <button onclick="deleteTransaction(${originalIndex})" class="text-rose-400 p-1"><i class="fa-solid fa-trash-can text-xs"></i></button>
            </div>
          </div>
        `;
      }).join('');

      const uniqueTx = Array.from(new Set(appData.transactions.map(t => JSON.stringify({ amount: t.amount, type: t.type, recurrence: t.recurrence, note: t.note }))))
                            .map(s => JSON.parse(s))
                            .slice(-3);

      quickDiv.innerHTML = uniqueTx.map(tx => `
        <button onclick="reuseTransaction('${tx.amount}', '${tx.type}', '${tx.recurrence}', '${tx.note}')" class="text-[10px] bg-zinc-950 border border-zinc-800 px-2 py-1 rounded-lg flex items-center gap-1 text-zinc-300">
          <span class="${tx.type === 'deposit' ? 'text-emerald-400' : 'text-rose-400'} font-bold">${tx.type === 'deposit' ? '+' : '-'}</span>
          <span>${formatPYG(tx.amount)}</span>
        </button>
      `).join('');
    }

    function updateChart(currentSaved, totalCost, weeks) {
      const ctx = document.getElementById('savingsChart').getContext('2d');
      const labels = [];
      const idealData = [];
      const realData = [];
      const weeklyIdeal = totalCost / (weeks || 8);

      for (let i = 0; i <= Math.min(weeks || 8, 6); i++) {
        labels.push(`S${i}`);
        idealData.push(Math.round(weeklyIdeal * i));
        if (i === 0) realData.push(0);
        else if (i === 1) realData.push(currentSaved);
        else realData.push(null);
      }

      if (savingsChart) savingsChart.destroy();

      savingsChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            { label: 'Ideal', data: idealData, borderColor: '#52525b', borderDash: [3, 3], pointRadius: 0 },
            { label: 'Real', data: realData, borderColor: '#10b981', pointRadius: 2 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#71717a', font: { size: 8 } } },
            y: { grid: { color: '#27272a' }, ticks: { color: '#71717a', font: { size: 8 } } }
          }
        }
      });
    }

    // CONSULTA A GEMINI LEIENDO LA CLAVE DESDE LOCALSTORAGE
    document.getElementById('askAiBtn').addEventListener('click', async () => {
      const activeGoal = appData.goals[appData.activeGoalIndex];
      if (!activeGoal) return;

      const userKey = localStorage.getItem('gemini_key');
      if (!userKey) {
        setApiKeyPrompt();
        return;
      }

      const aiDiv = document.getElementById('aiResponse');
      aiDiv.innerHTML = "<p class='animate-pulse text-emerald-400 text-xs'>Consultando Google Gemini...</p>";

      const walletBalance = calculateWalletBalance();
      const remaining = Math.max(activeGoal.cost - walletBalance, 0);

      const weeklyIncomes = (appData.transactions || [])
        .filter(t => t.type === 'deposit' && t.recurrence === 'weekly')
        .reduce((acc, t) => acc + t.amount, 0);

      const monthlyIncomes = (appData.transactions || [])
        .filter(t => t.type === 'deposit' && t.recurrence === 'monthly')
        .reduce((acc, t) => acc + t.amount, 0);

      const promptText = `Eres un asesor financiero inteligente. Meta actual del usuario: ${activeGoal.item}, Costo Total: ${formatPYG(activeGoal.cost)}, Ahorrado: ${formatPYG(walletBalance)}, Faltante: ${formatPYG(remaining)}. Salario semanal: ${formatPYG(weeklyIncomes)}, Salario mensual: ${formatPYG(monthlyIncomes)}. Da una estrategia o consejo financiero corto para acelerar este objetivo en maximo 2 oraciones. Sin asteriscos.`;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${userKey}`;
        
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: promptText }]
            }]
          })
        });

        const data = await response.json();
        let reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
        
        if (reply) {
          aiDiv.innerHTML = `<p class="text-zinc-200 text-xs text-left">${reply.replace(/\*/g, "").trim()}</p>`;
        } else {
          throw new Error("Error en respuesta");
        }
      } catch (err) {
        let advice = "Para acelerar tu compra, destina automáticamente un porcentaje fijo de tus ingresos semanales a un fondo de reserva antes de realizar egresos personales.";
        aiDiv.innerHTML = `<p class="text-zinc-300 text-xs text-left">${advice}</p>`;
      }
    });
  </script>
</body>
